# ====================
# BASIC CONFIGURATION
# ====================

# Set prefix to C-g instead of C-b (better for emacs users)
unbind-key C-b
set -g prefix 'C-g'
bind-key 'C-g' send-prefix

# Start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# ====================
# DISPLAY SETTINGS
# ====================

# Terminal settings
set -g default-terminal "tmux-256color"

# terminal-features supersedes terminal-overrides from tmux 3.2 on. The old
# form only matched a literal xterm-256color outer terminal, so truecolor was
# lost under Ghostty, Kitty, Alacritty and WezTerm. "*" covers them all, and
# tmux still probes the terminal before using a capability.
set -as terminal-features ",*:RGB,*:usstyle,*:hyperlinks,*:clipboard"
set -g bell-action any

# Window titles
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'

# Aggressive resize for multi-monitor setups
setw -g aggressive-resize on

# Focus events for terminal applications
set -g focus-events on

# macOS starts a login shell per pane, which re-runs /usr/libexec/path_helper
# and reorders PATH on every split. Running $SHELL directly gives a
# non-login interactive shell and leaves PATH as the session inherited it.
set -g default-command "${SHELL}"

# Let tmux forward copies to the host terminal over OSC 52, including across
# SSH, which is what tmux-yank relies on.
#
# "external" rather than "on" (see TODO #45): both forward tmux's own copies,
# but "on" additionally honours OSC 52 sequences emitted by programs *inside*
# a pane -- so anything that can write to your terminal (a log line, a curl of
# a hostile page, a compromised dependency's build output) can silently set
# the system clipboard, which the next paste executes. "external" is also
# tmux's own default.
set -g set-clipboard external

# ====================
# TIMING SETTINGS
# ====================

# Reduce escape time delay for vim
set -s escape-time 10

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Large scrollback buffer
set -g history-limit 50000

# ====================
# INPUT SETTINGS
# ====================

# Use emacs keybindings in the command prompt and in copy-mode. mode-keys is
# set explicitly because tmux otherwise infers it from $EDITOR/$VISUAL, and
# would silently switch to vi mode if either ever contains "vi".
set -g status-keys emacs
setw -g mode-keys emacs

# Pass through xterm keys
set -g extended-keys on

# Monitor activity in background windows
setw -g monitor-activity on
set -g visual-activity on

# Let tmux name windows after the running program, but stop programs from
# renaming them via escape sequences, which is what makes names jump around.
set -g allow-rename off
setw -g automatic-rename on

# Stay attached when the last window of a session closes, switching to another
# session instead of dropping to the shell.
set -g detach-on-destroy off

# The default one second is too short to read the pane numbers.
set -g display-panes-time 2000

# ====================
# KEY BINDINGS
# ====================

# Reload config file
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# SSH shortcut
bind-key S command-prompt -p ssh: "new-window -n %1 'ssh %1'"

# Intuitive pane splitting (preserve current directory)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# `l` above shadows the default last-window binding; put it on the prefix key
# itself, which is the usual convention and pairs well with C-g.
bind-key C-g last-window

# Pane resizing. -r makes the binding repeatable, so the prefix does not need
# to be pressed again for each nudge.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix-less pane navigation.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Toggle the status bar when the screen is needed for something else.
bind-key b set-option status

# ====================
# STATUS BAR
# ====================

# Deliberately empty. The catppuccin plugin below owns the status line, and a
# hand-written status-left/status-right here would be silently overwritten by
# it -- which is exactly what used to happen. Configure the bar through the
# plugin's @catppuccin_* options instead.

# ================================================
# Experimental
# ================================================

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-sensible is deliberately not loaded. Everything it sets -- escape-time,
# history-limit, display-time, status-interval, status-keys, focus-events,
# aggressive-resize -- is already set above, and because tpm runs last the
# plugin's opinions landed on top of the explicit settings rather than
# deferring to them.

# The plugins are installed by `make tmux-plugins`, each at the commit pinned in
# scripts/tmux-plugins.txt; a new @plugin line needs an entry there too. Avoid
# tpm's own install and update keys (prefix + I, prefix + U): they fetch the
# latest code, which moves the plugins off their pins.
#
# Guarded: without tpm installed, an unguarded run would print an error on
# every tmux start. Note this executes third-party code at startup.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
