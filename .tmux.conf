# ====================
# BASIC CONFIGURATION
# ====================

# Set prefix to C-g instead of C-b (better for emacs users)
unbind-key C-b
set -g prefix 'C-g'
bind-key 'C-g' send-prefix

# Start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# ====================
# DISPLAY SETTINGS
# ====================

# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g bell-action any

# Window titles
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'

# Aggressive resize for multi-monitor setups
setw -g aggressive-resize on

# Focus events for terminal applications
set -g focus-events on

# ====================
# TIMING SETTINGS
# ====================

# Reduce escape time delay for vim
set -s escape-time 10

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Large scrollback buffer
set -g history-limit 50000

# ====================
# INPUT SETTINGS
# ====================

# Use emacs keybindings in command mode
set -g status-keys emacs

# Pass through xterm keys
set -g extended-keys on

# Monitor activity in background windows
setw -g monitor-activity on
set -g visual-activity on

# ====================
# KEY BINDINGS
# ====================

# Reload config file
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# SSH shortcut
bind-key S command-prompt -p ssh: "new-window -n %1 'ssh %1'"

# Intuitive pane splitting (preserve current directory)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ====================
# STATUS BAR
# ====================

# Basic status bar settings
set -g status on
set -g status-bg 'colour235'
set -g status-justify 'centre'
set -g status-left-length '100'
set -g status-right-length '100'

# Status bar content
set -g status-left '#[fg=colour232,bg=colour154][#S#[fg=colour154,bg=colour238,nobold,nounderscore,noitalics]::#[fg=colour222,bg=colour238]#W#[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]] <#[fg=colour121,bg=colour235]#(whoami) -#(uptime | sed "s/.*up //" | sed "s/,.*//" | xargs)#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]>'

set -g status-right '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]<#[fg=colour121,bg=colour235]%r%a %Y> [#[fg=colour222,bg=colour238]#H#[fg=colour154,bg=colour238,nobold,nounderscore,noitalics]]'

# Window status format
setw -g window-status-format '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics] <#[default] #I - #W #[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]> '
